[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
baseRadius = "large"
showWidgetBorder = true
font = "Pretendard, sans-serif"
headingFont = "Pretendard, sans-serif"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f6f6f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#141413"
secondaryBackgroundColor = "#222221"
textColor = "#f0efec"
borderColor = "#2c2c2a"
